}

    display:inline-block;

    display:flex;

.btn{
    display:inline-block;
    padding:13px 22px;
    border-radius:10px;
    font-weight:700;
    transition:.25s;
}

.btn-primary{
    background:#198ee8;
    color:white;
    box-shadow:0 8px 30px rgba(25,142,232,.25);
}

.btn-primary:hover{
    transform:translateY(-2px);
    background:#2ca3fa;
}

.btn-secondary{
    border:1px solid #31506f;
    color:#dcecff;
}

.btn-secondary:hover{
    border-color:#42aaff;

}
